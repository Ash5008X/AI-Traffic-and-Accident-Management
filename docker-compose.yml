services:
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile

    container_name: nexustraffic-backend

    env_file:
      - ./server/.env

    ports:
      - "5000:5000"

    restart: unless-stopped

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile

    container_name: nexustraffic-frontend

    ports:
      - "8000:80"

    depends_on:
      - backend

    restart: unless-stopped